# Environnement de DÉVELOPPEMENT uniquement (mots de passe de test, données fictives).
#   docker compose -f deploy/docker-compose.yml up -d postgres
#   docker compose -f deploy/docker-compose.yml --profile auth up -d keycloak
#
# Pipeline temps réel de l'enrôlement (profil « temps-reel », voir pipeline/README.md) :
#   docker compose -f deploy/docker-compose.yml --profile temps-reel up -d --build
#   MOSIP simulée → Debezium → Kafka → job PySpark → base BI → API (8080) → page http://localhost:5173/enrolement
#   Interface Kafka (lecture seule) : http://localhost:8090
#   Vérification : docker compose -f deploy/docker-compose.yml run --rm outils
name: bi-anid

# Image du pipeline (job PySpark, simulateur MOSIP, outils), construite depuis pipeline/Dockerfile.
x-pipeline: &pipeline
  profiles: ["temps-reel"]
  build: ../pipeline
  image: bi-anid/pipeline:dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bi
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: bi
    ports:
      - "5432:5432"
    volumes:
      - donnees-bi:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi -d bi"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-anid-dev.json:/opt/keycloak/data/import/realm-anid-dev.json:ro

  # -------------------------------------------------------------------------------------------------------------
  # Pipeline temps réel (profil « temps-reel »)
  # -------------------------------------------------------------------------------------------------------------

  # Certificat auto-signé pour que Debezium se connecte en TLS (sslmode=require), comme en production.
  certificats-dev:
    <<: *pipeline
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -e;
        [ -f /certs/server.key ] || openssl req -x509 -nodes -newkey rsa:2048 -days 3650 -subj /CN=mosip-sim
        -keyout /certs/server.key -out /certs/server.crt;
        chown 999:999 /certs/server.key /certs/server.crt;
        chmod 600 /certs/server.key
    volumes:
      - certificats-mosip-sim:/certs

  # Base MOSIP SIMULÉE : table regprc.registration au DDL officiel v1.1.5, rôle et publication posés comme le
  # ferait le DBA (deploy/mosip-sim/init). Aucune donnée réelle.
  mosip-sim:
    profiles: ["temps-reel"]
    image: postgres:17-bookworm
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=1GB
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    environment:
      POSTGRES_DB: mosip_regprc
      POSTGRES_USER: sysadmin
      POSTGRES_PASSWORD: ${MOSIP_SIM_MOT_DE_PASSE:-mosip_sim_dev}
      MOSIP_CDC_MOT_DE_PASSE: ${MOSIP_CDC_MOT_DE_PASSE:-bi_cdc_dev}
    ports:
      - "5433:5432"
    volumes:
      - donnees-mosip-sim:/var/lib/postgresql/data
      - certificats-mosip-sim:/certs:ro
      - ./mosip-sim/init/01-schema-regprc.sql:/docker-entrypoint-initdb.d/01-schema-regprc.sql:ro
      - ../pipeline/sources/ddl/mosip_regprc/regprc-registration.sql:/docker-entrypoint-initdb.d/02-regprc-registration.sql:ro
      - ./mosip-sim/init/03-prerequis-cdc.sql:/docker-entrypoint-initdb.d/03-prerequis-cdc.sql:ro
    depends_on:
      certificats-dev:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysadmin -d mosip_regprc"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Joue le rôle de MOSIP : crée des inscriptions fictives et les fait avancer (pipeline/simulateur).
  simulateur-mosip:
    <<: *pipeline
    command: ["python", "-m", "simulateur.simulateur"]
    environment:
      MOSIP_SIM_DSN: host=mosip-sim dbname=mosip_regprc user=sysadmin password=${MOSIP_SIM_MOT_DE_PASSE:-mosip_sim_dev}
      CENTRES: 10011,10012,10021,10022,10031,10032,10041,10042,10051,10052,10061,10062
      INSCRIPTIONS_INITIALES: "3000"
      INTERVALLE_S: "5"
    depends_on:
      mosip-sim:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    profiles: ["temps-reel"]
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: bOQ3XU5mTqSVhkzjvPpU-g
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - donnees-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  # Kafka Connect avec Debezium 3.7. Secrets lus dans l'environnement du worker (${env:...} dans le connecteur).
  connect:
    profiles: ["temps-reel"]
    image: quay.io/debezium/connect:3.7.0.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: bi-anid-connect-dev
      CONFIG_STORAGE_TOPIC: connect_config
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      MOSIP_CDC_UTILISATEUR: bi_cdc
      MOSIP_CDC_MOT_DE_PASSE: ${MOSIP_CDC_MOT_DE_PASSE:-bi_cdc_dev}
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      mosip-sim:
        condition: service_healthy

  # Interface web de Kafka (Kafbat UI) : topics, messages, groupes de consommateurs et connecteur Debezium.
  # http://localhost:8090, en lecture seule et accessible depuis ce poste seulement. Les messages contiennent le RID
  # en clair (fictif ici) : jamais d'interface de ce type sans authentification ni contrôle d'accès en recette ou
  # en production.
  kafka-ui:
    profiles: ["temps-reel"]
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: bi-anid-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      KAFKA_CLUSTERS_0_READONLY: "true"
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Enregistre le connecteur pipeline/cdc/connecteurs/regprc-dev.json (une fois, idempotent), puis s'arrête.
  connect-init:
    <<: *pipeline
    command: ["python", "-m", "outils.enregistrer_connecteur", "/connecteurs/regprc-dev.json"]
    volumes:
      - ../pipeline/cdc/connecteurs:/connecteurs:ro
    depends_on:
      connect:
        condition: service_started
    restart: "no"

  # Job temps réel : topic Debezium → etat.registration → bi.fait_enrolement_jour (lot toutes les 10 s).
  spark-enrolement:
    <<: *pipeline
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TOPICS: mosip.dev.regprc.registration
      CHECKPOINT_LOCATION: /donnees/checkpoints/etat_regprc_g1
      NOM_REQUETE: etat_regprc@g1
      DATAMART_DSN: host=postgres dbname=bi user=bi password=bi
      CLE_HMAC: ${CLE_HMAC_DEV:-cle-de-developpement-uniquement-a-ne-jamais-reutiliser}
      INTERVALLE_LOT: 10 seconds
      MAX_OFFSETS_PAR_LOT: "5000"
      # Au premier lancement, l'API télécharge ses dépendances Maven avant d'appliquer les migrations.
      ATTENTE_DATAMART_S: "1800"
    volumes:
      - checkpoints-spark:/donnees
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      connect-init:
        condition: service_completed_successfully
    restart: on-failure:5

  # API (profil dev : Flyway applique V1, V2 et les données de démonstration au démarrage).
  api:
    profiles: ["temps-reel"]
    image: maven:3.9-eclipse-temurin-21
    working_dir: /backend
    command: ["mvn", "-q", "spring-boot:run", "-Dspring-boot.run.profiles=dev"]
    environment:
      BI_DB_URL: jdbc:postgresql://postgres:5432/bi
      BI_ORIGINES_AUTORISEES: http://localhost:5173
    volumes:
      - ../backend:/backend
      - cache-maven:/root/.m2
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Interface (Vite) : http://localhost:5173, appels /api redirigés vers le service api.
  front:
    profiles: ["temps-reel"]
    image: node:22-alpine
    working_dir: /frontend
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      API_PROXY_CIBLE: http://api:8080
    volumes:
      - ../frontend:/frontend
      - modules-front:/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  # Outils ponctuels (non démarrés par « up ») : vérification de la chaîne, tests du pipeline dans un conteneur.
  #   docker compose -f deploy/docker-compose.yml run --rm outils
  #   docker compose -f deploy/docker-compose.yml run --rm outils python -m pytest
  outils:
    <<: *pipeline
    profiles: ["outils"]
    command: ["python", "-m", "outils.verifier_temps_reel"]
    environment:
      MOSIP_SIM_DSN: host=mosip-sim dbname=mosip_regprc user=sysadmin password=${MOSIP_SIM_MOT_DE_PASSE:-mosip_sim_dev}
      DATAMART_DSN: host=postgres dbname=bi user=bi password=bi
      DATAMART_DSN_TEST: host=postgres dbname=postgres user=bi password=bi
      MIGRATIONS_DIR: /app/db
      CONNECT_URL: http://connect:8083
      API_URL: http://api:8080
    volumes:
      - ../backend/src/main/resources/db:/app/db:ro
    restart: "no"

volumes:
  donnees-bi:
  donnees-mosip-sim:
  certificats-mosip-sim:
  donnees-kafka:
  checkpoints-spark:
  cache-maven:
  modules-front:
