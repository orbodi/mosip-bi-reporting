# Pipeline temps réel (Python) : job PySpark, simulateur MOSIP, outils. Le dbt_project.yml voisin est l'ébauche
# par lots antérieure (docs/decisions.md, 16/10/2026).
[project]
name = "bi-anid-pipeline"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["streaming/tests", "simulateur", "outils"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
