# Copier dans ~/.dbt/profiles.yml (ou définir DBT_PROFILES_DIR). Mots de passe par variables d'environnement.
bi_anid:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5432
      user: bi
      password: "{{ env_var('BI_DB_PASSWORD', 'bi') }}"
      dbname: bi
      schema: bi
      threads: 4
