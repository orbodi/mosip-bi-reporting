version: 2

# Tables MOSIP copiées par l'extraction dans le schéma « brut » de la base BI (voir extraction/README.md).
# Colonnes À VALIDER sur le schéma MOSIP déployé à l'ANID (docs/sources-mosip.md).
sources:
  - name: brut
    schema: brut
    tables:
      - name: registration
        description: Paquets d'inscription (mosip_regprc.registration).
        columns:
          - name: id
            description: RID (29 chiffres ; centre = 5 premiers, machine = 5 suivants).
            data_tests: [not_null, unique]
      - name: registration_transaction
        description: Étapes de traitement des paquets (mosip_regprc.registration_transaction).
      - name: anonymous_profile
        description: Profil démographique anonyme (sexe, âge) par paquet (mosip_idrepo / mosip_regprc).
      - name: location
        description: Référentiel territorial (master.location).
      - name: registration_center
        description: Centres d'enrôlement (master.registration_center).
